name: Strip
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SDKROOT: macosx
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Strip:
    type: application
    platform: macOS
    sources:
      - path: Strip
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Sparkle
        product: Sparkle
    configFiles:
      Debug: Brand.xcconfig
      Release: Brand.xcconfig
    settings:
      base:
        PRODUCT_NAME: $(STRIP_APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(STRIP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Strip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Copy engine binaries
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/../scripts/build-engine.sh"
  StripTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StripTests
      - path: Strip
        excludes:
          - App/Entry.swift
    configFiles:
      Debug: Brand.xcconfig
      Release: Brand.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(STRIP_BUNDLE_ID).tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
schemes:
  Strip:
    build:
      targets:
        Strip: all
        StripTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: StripTests
          parallelizable: false
          randomExecutionOrder: false
      environmentVariables:
        STRIP_REPO_ROOT: $(SRCROOT)/..
        STRIP_APP_PATH: $(BUILT_PRODUCTS_DIR)/$(STRIP_APP_NAME).app
