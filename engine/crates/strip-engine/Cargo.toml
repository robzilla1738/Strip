[package]
name = "strip-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "strip-engine"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
cocoa = "0.26"
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
libc = "0.2"
objc = "0.2"
serde_json = "1"
notify = { version = "8", features = ["macos_fsevent"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
strip-core = { path = "../strip-core" }
strip-ipc = { path = "../strip-ipc" }
toml = "1"

[dev-dependencies]
mockall = "0.13"
